<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InputNexus - PC入力デバイス統合マネージャー (ショートカットカスタマイズ＆キー干渉防止機能付)</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg" />
  
  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-card: rgba(18, 22, 31, 0.85);
      --bg-glass: rgba(15, 20, 30, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-yellow: #ffb800;
      --accent-purple: #9d4edd;
      --accent-red: #ff3366;
      --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.35);
      --font-main: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
    }

    .app-container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .app-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      padding: 16px 24px; background: var(--bg-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); border-radius: 16px;
    }
    .brand-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .brand-logo-img { width: 44px; height: 44px; border-radius: 10px; box-shadow: var(--glow-cyan); border: 1px solid var(--accent-cyan); object-fit: cover; }
    .badge-v { background: rgba(0,255,136,0.15); color: var(--accent-green); font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(0,255,136,0.3); }
    .sub-text { color: var(--text-muted); font-size: 0.84rem; margin-top: 2px; }

    .mode-switcher-bar {
      display: flex; gap: 10px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 12px; border: 1px solid var(--border-color);
    }
    .mode-btn {
      padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; color: var(--text-muted); background: transparent;
    }
    .mode-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .mode-btn.active { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; box-shadow: var(--glow-cyan); }
    .mode-btn.tray { background: rgba(157, 78, 221, 0.2); color: #e2b6ff; border: 1px solid rgba(157, 78, 221, 0.4); }
    
    .btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; font-weight: 700; border: none; }
    .btn.accent { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .btn.danger { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-card); padding: 12px 20px; border-radius: 14px; border: 1px solid var(--border-color);
    }
    .stat-pill { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.84rem; }

    .category-section { display: flex; flex-direction: column; gap: 12px; }
    .cat-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      transition: all 0.2s ease; position: relative;
    }
    .card.active-glow {
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      animation: pulse-anim 1.0s infinite alternate;
    }
    @keyframes pulse-anim { 0% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); } 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.7); } }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .dev-name-container { display: flex; align-items: center; gap: 6px; }
    .dev-name { font-size: 0.98rem; font-weight: 700; color: #fff; }

    .rename-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; }
    .dev-sub { color: var(--text-muted); font-size: 0.76rem; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .conn-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px;
      font-size: 0.74rem; font-weight: 700; font-family: var(--font-mono);
    }
    .conn-badge.usb { background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 240, 255, 0.3); }
    .conn-badge.bluetooth { background: rgba(157, 78, 221, 0.2); color: #e2b6ff; border: 1px solid rgba(157, 78, 221, 0.4); }

    .badge-status { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.74rem; }
    .badge-status.active { background: rgba(0,255,136,0.15); color: var(--accent-green); border: 1px solid rgba(0,255,136,0.3); }
    .badge-status.off { background: rgba(255,51,102,0.15); color: var(--accent-red); border: 1px solid rgba(255,51,102,0.3); }

    .switch-btn {
      padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none;
    }
    .switch-btn.on { background: rgba(0,255,136,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .switch-btn.off { background: rgba(255,51,102,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .telemetry-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); font-size: 0.78rem; font-family: var(--font-mono); }
    
    .hud-overlay {
      position: fixed; top: 16px; right: 16px; width: 380px; z-index: 9999;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(16px); border: 1px solid var(--accent-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.8), var(--glow-cyan); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }

    .tray-banner {
      position: fixed; bottom: 20px; right: 20px; z-index: 10000;
      background: rgba(18,22,31,0.95); border: 1px solid var(--accent-purple); box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      padding: 12px 18px; border-radius: 14px; display: flex; align-items: center; gap: 12px;
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 10000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #121620; border: 1px solid var(--border-color); border-radius: 18px; padding: 24px; max-width: 540px; width: 100%;
      display: flex; flex-direction: column; gap: 16px;
    }

    .toast {
      background: rgba(0,240,255,0.15); border: 1px solid var(--accent-cyan); color: #fff;
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.88rem;
    }

    .hotkey-setting-box {
      background: rgba(0,0,0,0.4); border: 1px solid var(--accent-cyan); padding: 14px; border-radius: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [viewMode, setViewMode] = useState('full');
      const [hudHotkey, setHudHotkey] = useState({ alt: true, shift: true, ctrl: false, key: 'd' });
      const [enableHotkeys, setEnableHotkeys] = useState(true);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      const [devices, setDevices] = useState([
        {
          id: 'mouse_logicool_default',
          name: '【Logicool】 ゲーミングマウス (G PRO / MX Master)',
          brand: 'Logicool / Logitech',
          category: 'マウス / ポインティング',
          connectionType: 'usb',
          connectionTypeLabel: '🔌 USB 有線 / 🔵 Bluetooth',
          enabled: true,
          lastActive: Date.now(),
          telemetry: '入力検知待機中...'
        }
      ]);
      const [toast, setToast] = useState(null);
      const [hudOpacity, setHudOpacity] = useState(0.85);
      const [editingId, setEditingId] = useState(null);
      const [tempName, setTempName] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const registerOrUpdateDevice = (devInfo) => {
        setDevices(prev => {
          const exists = prev.find(d => d.id === devInfo.id || (devInfo.category === 'マウス / ポインティング' && d.category === 'マウス / ポインティング'));
          if (exists) {
            if (!exists.enabled) return prev;
            return prev.map(d => (d.id === exists.id) ? { 
              ...d, 
              ...devInfo, 
              name: d.customName || d.name || devInfo.name, 
              lastActive: Date.now() 
            } : d);
          }
          return [...prev, { ...devInfo, customName: null, enabled: true, lastActive: Date.now() }];
        });
      };

      const toggleDevice = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const nextState = !d.enabled;
            showToast(`[${d.customName || d.name}] の入力を ${nextState ? '有効化 (ON)' : '停止 (OFF)'} にしました。`);
            return { ...d, enabled: nextState };
          }
          return d;
        }));
      };

      const emergencyResetAll = () => {
        setDevices(prev => prev.map(d => ({ ...d, enabled: true })));
        showToast('【全機器復旧】すべてのデバイスの無効化を解除し、ON状態に一括リセットしました！');
      };

      const saveCustomName = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const newName = tempName.trim() || d.name;
            showToast(`名称を [${newName}] に保存しました！`);
            return { ...d, customName: newName, name: newName };
          }
          return d;
        }));
        setEditingId(null);
      };

      const getHotkeyLabel = () => {
        const parts = [];
        if (hudHotkey.ctrl) parts.push('Ctrl');
        if (hudHotkey.alt) parts.push('Alt');
        if (hudHotkey.shift) parts.push('Shift');
        parts.push(hudHotkey.key.toUpperCase());
        return parts.join(' + ');
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            emergencyResetAll();
            return;
          }

          if (enableHotkeys) {
            const matchAlt = hudHotkey.alt === e.altKey;
            const matchShift = hudHotkey.shift === e.shiftKey;
            const matchCtrl = hudHotkey.ctrl === e.ctrlKey;
            const matchKey = hudHotkey.key.toLowerCase() === e.key.toLowerCase();

            if (matchAlt && matchShift && matchCtrl && matchKey) {
              e.preventDefault();
              setViewMode(prev => prev === 'hud' ? 'full' : 'hud');
              showToast(viewMode === 'hud' ? '🖥️ フル管理画面に切替' : `📌 ミニHUD表示に切替 (${getHotkeyLabel()})`);
              return;
            }
          }
          
          registerOrUpdateDevice({
            id: 'real_keyboard_main',
            name: 'メインキーボード / キー入力機器',
            category: 'キーボード・テンキー類',
            connectionType: 'usb',
            connectionTypeLabel: '🔌 Windows PnP 直結',
            telemetry: `最新キー: [${e.key === ' ' ? 'Space' : e.key}] | リアルタイム入力検知`
          });
        };

        const handleMouseMove = (e) => {
          if (Math.abs(e.movementX) > 5 || Math.abs(e.movementY) > 5) {
            registerOrUpdateDevice({
              id: 'mouse_logicool_default',
              name: '【Logicool】 ゲーミングマウス (G PRO / MX Master)',
              category: 'マウス / ポインティング',
              connectionType: 'usb',
              connectionTypeLabel: '🔌 有線 / 🔵 Bluetooth',
              telemetry: `移動検知: ${Math.round(Math.sqrt(e.movementX**2 + e.movementY**2))} px/f`
            });
          }
        };

        const handleMouseDown = (e) => {
          const btnName = e.button === 0 ? 'Left Click' : e.button === 2 ? 'Right Click' : 'Middle Click';
          registerOrUpdateDevice({
            id: 'mouse_logicool_default',
            name: '【Logicool】 ゲーミングマウス (G PRO / MX Master)',
            category: 'マウス / ポインティング',
            connectionType: 'usb',
            connectionTypeLabel: '🔌 有線 / 🔵 Bluetooth',
            telemetry: `クリック検知: ${btnName}`
          });
        };

        const scanGamepads = () => {
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (gp) {
              const isBt = gp.id.toLowerCase().includes('bluetooth') || gp.id.toLowerCase().includes('wireless');
              const connLabel = isBt ? '🔵 Bluetooth 無線' : '🔌 USB 有線';

              if (gp.buttons.some(b => b.pressed) || gp.axes.some(a => Math.abs(a) > 0.15)) {
                registerOrUpdateDevice({
                  id: `gp_${gp.index}`,
                  name: gp.id ? gp.id.split('(')[0] : `ゲームコントローラー #${gp.index + 1}`,
                  category: 'ゲームコントローラー',
                  connectionType: isBt ? 'bluetooth' : 'usb',
                  connectionTypeLabel: connLabel,
                  telemetry: `操作検知中`
                });
              }
            }
          }
        };

        const timer = setInterval(scanGamepads, 200);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mousedown', handleMouseDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mousedown', handleMouseDown);
          clearInterval(timer);
        };
      }, [viewMode, hudHotkey, enableHotkeys]);

      const categories = Array.from(new Set(devices.map(d => d.category)));

      if (viewMode === 'hud') {
        return (
          <div className="hud-overlay" style={{ opacity: hudOpacity }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 700, color: '#00f0ff', fontSize: '0.9rem', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <img src="icon.jpg" style={{ width: 18, height: 18, borderRadius: 4 }} />
                InputNexus ミニHUD
              </span>
              <button className="btn primary" style={{ padding: '3px 10px', fontSize: '0.75rem' }} onClick={() => setViewMode('full')}>
                🖥️ フル画面に戻る
              </button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {devices.map(d => (
                <div key={d.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.05)', padding: '6px 10px', borderRadius: '8px' }}>
                  <div>
                    <span style={{ fontWeight: 600, fontSize: '0.85rem' }}>{d.customName || d.name}</span>
                  </div>
                  <button className={`switch-btn ${d.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(d.id)}>{d.enabled ? 'ON' : 'OFF'}</button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (viewMode === 'tray') {
        return (
          <div className="tray-banner">
            <div>
              <div style={{ fontWeight: 700, color: '#e2b6ff', fontSize: '0.9rem' }}>⚙️ InputNexus タスクバー常駐中</div>
              <div style={{ fontSize: '0.78rem', color: '#8a99ad' }}>画面を邪魔せずバックグラウンドで動作中</div>
            </div>
            <div style={{ display: 'flex', gap: '6px' }}>
              <button className="btn primary" style={{ padding: '4px 10px', fontSize: '0.8rem' }} onClick={() => setViewMode('hud')}>📌 ミニHUD ({getHotkeyLabel()})</button>
              <button className="btn" style={{ padding: '4px 10px', fontSize: '0.8rem' }} onClick={() => setViewMode('full')}>🖥️ 開く</button>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {toast && <div className="toast">🔔 {toast}</div>}

          <header className="app-header">
            <div>
              <div className="brand-title">
                <img src="icon.jpg" className="brand-logo-img" alt="InputNexus Logo" />
                <span>InputNexus Hybrid</span>
                <span className="badge-v">キー干渉防止・カスタマイズ対応</span>
              </div>
              <div className="sub-text">他アプリと干渉しない自由なショートカットキー設定 ＆ ハイブリッド常駐</div>
            </div>

            <div className="mode-switcher-bar">
              <button 
                className={`mode-btn ${viewMode === 'full' ? 'active' : ''}`}
                onClick={() => setViewMode('full')}
              >
                🖥️ フル管理画面
              </button>
              <button 
                className={`mode-btn ${viewMode === 'hud' ? 'active' : ''}`}
                onClick={() => { setViewMode('hud'); showToast(`📌 ミニHUD表示 (${getHotkeyLabel()})`); }}
              >
                📌 ミニHUD ({getHotkeyLabel()})
              </button>
              <button 
                className={`mode-btn tray ${viewMode === 'tray' ? 'active' : ''}`}
                onClick={() => { setViewMode('tray'); showToast('⚙️ タスクバー常駐モード（画面非表示）'); }}
              >
                ⚙️ 常駐 (非表示)
              </button>
              <button 
                className="mode-btn"
                style={{ color: '#00f0ff' }}
                onClick={() => setShowSettingsModal(true)}
                title="キー干渉対策・ショートカットキーの自由変更設定"
              >
                ⚙️ キー設定
              </button>
            </div>
          </header>

          <div className="stats-bar">
            <span className="stat-pill">検出機器: <strong>{devices.length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#00ff88' }}>ON (有効): <strong>{devices.filter(d => d.enabled).length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#ff3366' }}>OFF (無効): <strong>{devices.filter(d => !d.enabled).length} 台</strong></span>
            <button className="btn danger" style={{ padding: '4px 10px', fontSize: '0.78rem' }} onClick={emergencyResetAll} title="Ctrl+Alt+Shift+R">🚨 全機器一括復旧</button>
          </div>

          {categories.map(cat => (
            <div key={cat} className="category-section">
              <div className="cat-title">📁 {cat}</div>
              <div className="cards-grid">
                {devices.filter(d => d.category === cat).map(device => {
                  const isRecent = device.enabled && (Date.now() - device.lastActive < 1800);
                  return (
                    <div key={device.id} className={`card ${isRecent ? 'active-glow' : ''}`}>
                      <div className="card-top">
                        <div>
                          {editingId === device.id ? (
                            <div style={{ display: 'flex', gap: '4px' }}>
                              <input 
                                type="text" 
                                style={{ background: '#000', border: '1px solid #00f0ff', color: '#fff', padding: '2px 6px', borderRadius: '4px' }}
                                value={tempName}
                                onChange={e => setTempName(e.target.value)}
                              />
                              <button className="btn primary" style={{ padding: '2px 6px', fontSize: '0.7rem' }} onClick={() => saveCustomName(device.id)}>保存</button>
                            </div>
                          ) : (
                            <div className="dev-name-container">
                              <div className="dev-name">{device.customName || device.name}</div>
                              <button className="rename-btn" title="好きな名前に命名保存" onClick={() => { setEditingId(device.id); setTempName(device.customName || device.name); }}>✏️</button>
                            </div>
                          )}
                          <div className="dev-sub">
                            <span className={`conn-badge ${device.connectionType}`}>
                              {device.connectionTypeLabel}
                            </span>
                          </div>
                        </div>
                        <button className={`switch-btn ${device.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(device.id)}>
                          {device.enabled ? 'ON' : 'OFF'}
                        </button>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span className={`badge-status ${device.enabled ? 'active' : 'off'}`}>
                          {device.enabled ? '🟢 ON (操作受付中)' : '🔴 OFF (入力停止中)'}
                        </span>
                        {isRecent && <span style={{ color: '#00f0ff', fontWeight: 700, fontSize: '0.78rem' }}>⚡ 入力検知中！</span>}
                      </div>

                      <div className="telemetry-box">
                        {device.enabled ? device.telemetry : '🛑 入力は安全に停止されています'}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {showSettingsModal && (
            <div className="modal-bg" onClick={() => setShowSettingsModal(false)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <h3 style={{ color: '#00f0ff' }}>⚙️ ショートカットキー干渉防止 ＆ 設定</h3>
                <div style={{ fontSize: '0.85rem', color: '#8a99ad', lineHeight: 1.5, display: 'flex', flexDirection: 'column', gap: '14px' }}>
                  <p>他のゲームやアプリ（OBS, Discord, Photoshop等）とキーが重なって干渉する場合は、呼び出しキーを自由に変更または無効化できます。</p>
                  
                  <div className="hotkey-setting-box">
                    <div>
                      <div style={{ fontWeight: 700, color: '#fff' }}>現在のミニHUD呼び出しキー</div>
                      <div style={{ color: '#00f0ff', fontWeight: 800, fontSize: '1.1rem', marginTop: '4px' }}>{getHotkeyLabel()}</div>
                    </div>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <button className="btn" onClick={() => setHudHotkey({ alt: false, shift: false, ctrl: false, key: 'F9' })}>F9キーに変更</button>
                      <button className="btn" onClick={() => setHudHotkey({ alt: true, shift: true, ctrl: false, key: 'd' })}>Alt+Shift+D (初期値)</button>
                    </div>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(0,0,0,0.3)', padding: '10px 14px', borderRadius: '8px' }}>
                    <span>ショートカットキー呼び出し機能を有効にする</span>
                    <button className={`switch-btn ${enableHotkeys ? 'on' : 'off'}`} onClick={() => setEnableHotkeys(!enableHotkeys)}>
                      {enableHotkeys ? '有効 (ON)' : '無効 (OFF)'}
                    </button>
                  </div>
                </div>
                <button className="btn primary" onClick={() => setShowSettingsModal(false)}>設定完了</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
