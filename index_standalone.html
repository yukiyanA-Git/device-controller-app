    .recommend-box {

      background: rgba(10,12,16,0.92); backdrop-filter: blur(16px); border: 1px solid var(--accent-cyan);

    .tray-banner {

      background: rgba(0,0,0,0.4); border: 1px solid var(--accent-cyan); padding: 14px; border-radius: 10px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CyberSound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playToggleOn(enabled) {
        if (!enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      },
      playToggleOff(enabled) {
        if (!enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.11);
      },
      playClick(enabled) {
        if (!enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      },
      playEmergency(enabled) {
        if (!enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.05);
          gain.gain.setValueAtTime(0.1, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.05);
          osc.stop(now + i * 0.05 + 0.15);
        });
      }
    };

    function DeviceSilhouette({ dev, enabled, isRecent }) {
      const color = !enabled 
        ? '#ff3366' 
        : isRecent 
          ? '#00f0ff' 
          : '#8a99ad';

      const name = (dev.customName || dev.name || '').toLowerCase();
      const cat = (dev.category || '').toLowerCase();

      // 1. Razer Tartarus / 左手デバイス
      if (name.includes('tartarus') || name.includes('orbweaver') || name.includes('左手') || cat.includes('左手') || cat.includes('lefthand')) {
        return (
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
            <rect x="20" y="15" width="45" height="42" rx="6" />
            <line x1="35" y1="15" x2="35" y2="57" />
            <line x1="50" y1="15" x2="50" y2="57" />
            <line x1="20" y1="29" x2="65" y2="29" />
            <line x1="20" y1="43" x2="65" y2="43" />
            <circle cx="78" cy="50" r="10" />
            <circle cx="78" cy="50" r="3" fill={color} />
            <path d="M22 66 C22 66, 28 85, 45 88 C62 88, 68 85, 68 66" />
          </svg>
        );
      }

      // 2. マウス / ポインティング機器
      if (cat.includes('マウス') || cat.includes('mouse') || name.includes('mouse') || name.includes('マウス')) {
        return (
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M50 15 C32 15, 26 30, 26 55 C26 78, 35 88, 50 88 C65 88, 74 78, 74 55 C74 30, 68 15, 50 15 Z" />
            <line x1="50" y1="15" x2="50" y2="46" />
            <rect x="46" y="26" width="8" height="15" rx="4" fill={isRecent && enabled ? color : 'none'} />
            <line x1="26" y1="45" x2="26" y2="58" strokeWidth="9" />
          </svg>
        );
      }

      // 3. ゲームコントローラー
      if (cat.includes('コントローラー') || cat.includes('gamepad') || name.includes('gamepad') || name.includes('controller') || name.includes('dual')) {
        return (
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
            <path d="M25 35 C18 42, 14 68, 22 84 C26 90, 34 88, 38 76 L44 60 L56 60 L62 76 C66 88, 74 90, 78 84 C86 68, 82 42, 75 35 C68 28, 32 28, 25 35 Z" />
            <line x1="32" y1="44" x2="32" y2="56" strokeWidth="5" />
            <line x1="26" y1="50" x2="38" y2="50" strokeWidth="5" />
            <circle cx="42" cy="58" r="6" />
            <circle cx="58" cy="58" r="6" />
            <circle cx="68" cy="46" r="2.5" fill={color} />
            <circle cx="74" cy="50" r="2.5" fill={color} />
            <circle cx="68" cy="54" r="2.5" fill={color} />
            <circle cx="62" cy="50" r="2.5" fill={color} />
          </svg>
        );
      }

      // 4. テンキー
      if (cat.includes('テンキー') || cat.includes('tenkey') || name.includes('テンキー') || name.includes('numpad')) {
        return (
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
            <rect x="28" y="16" width="44" height="68" rx="8" />
            <line x1="28" y1="36" x2="72" y2="36" />
            <line x1="28" y1="52" x2="72" y2="52" />
            <line x1="28" y1="68" x2="72" y2="68" />
            <line x1="43" y1="36" x2="43" y2="84" />
            <line x1="57" y1="36" x2="57" y2="84" />
          </svg>
        );
      }

      // デフォルト: フルキーボード
      return (
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" stroke={color} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round">
          <rect x="15" y="28" width="70" height="44" rx="8" />
          <line x1="15" y1="42" x2="85" y2="42" />
          <line x1="15" y1="56" x2="85" y2="56" />
          <line x1="32" y1="28" x2="32" y2="72" />
          <line x1="50" y1="28" x2="50" y2="72" />
          <line x1="68" y1="28" x2="68" y2="72" />
        </svg>
      );
    }

    function getSmartRecommendation(dev) {
      const name = (dev.customName || dev.name || '').toLowerCase();
      const cat = (dev.category || '').toLowerCase();

      if (name.includes('tartarus') || name.includes('orbweaver') || name.includes('左手') || cat.includes('左手') || cat.includes('lefthand')) {
        return {
          text: 'Razer Tartarus対応 交換パームレスト / 静音化',
          query: 'Razer Tartarus リストレスト 交換'
        };
      }
      if (name.includes('logicool') || name.includes('logitech')) {
        return {
          text: 'Logicool G 純正ソール / 充電ドック対応',
          query: 'Logicool G マウスソール 充電ドック'
        };
      }
      if (cat.includes('マウス') || cat.includes('mouse')) {
        return {
          text: 'ゲーミングマウス用 超低摩擦ガラスソール',
          query: 'ゲーミングマウス ソール 超低摩擦'
        };
      }
      if (cat.includes('コントローラー') || cat.includes('gamepad')) {
        return {
          text: 'エイム向上 スティッククッション / アシストキャップ',
          query: 'FPS エイム アシストキャップ'
        };
      }
      return {
        text: '高耐久メカニカル用 静音リング / リストレスト',
        query: 'キーボード リストレスト 静音リング'
      };
    }

    function App() {
      const [viewMode, setViewMode] = useState('full');
      const [hudHotkey, setHudHotkey] = useState({ alt: true, shift: true, ctrl: false, key: 'd' });
      const [enableHotkeys, setEnableHotkeys] = useState(true);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      const catMap = {
        'lefthand': '左手デバイス・キーパッド',
        'mouse': 'マウス / ポインティング',
        'keyboard': 'キーボード類',
        'gamepad': 'ゲームコントローラー',
        'tenkey': 'テンキー類'
      };

      const getInitialDevices = () => {
        if (window.DETECTED_PNP_DEVICES && Array.isArray(window.DETECTED_PNP_DEVICES) && window.DETECTED_PNP_DEVICES.length > 0) {
          return window.DETECTED_PNP_DEVICES.map(d => ({
            ...d,
            category: catMap[d.category] || d.category || 'その他入力機器',
            connectionTypeLabel: d.connectionType === 'bluetooth' ? '🔵 Bluetooth 無線' : '🔌 USB 有線',
            lastActive: Date.now(),
            telemetry: 'Windows PnP 接続確認済 (正常稼働)'
          }));
        }
        return [
          {
            id: 'mouse_logicool_default',
            name: '【Logicool】 ゲーミングマウス (G PRO / MX Master)',
            brand: 'Logicool / Logitech',
            category: 'マウス / ポインティング',
            connectionType: 'usb',
            connectionTypeLabel: '🔌 USB 有線 / 🔵 Bluetooth',
            enabled: true,
            lastActive: Date.now(),
            telemetry: '入力検知待機中...'
          }
        ];
      };

      const [devices, setDevices] = useState(getInitialDevices);
      const [toast, setToast] = useState(null);
      const [hudOpacity, setHudOpacity] = useState(0.85);
      const [editingId, setEditingId] = useState(null);
      const [tempName, setTempName] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        if (next) CyberSound.playToggleOn(true);
        showToast(next ? '🔊 SF効果音を ON にしました' : '🔇 効果音を OFF（消音）にしました');
      };

      const rescanDevices = () => {
        CyberSound.playClick(soundEnabled);
        showToast('🔄 最新のPnP機器を再スキャン中...');
        const s = document.createElement('script');
        s.src = 'devices_data.js?t=' + Date.now();
        s.onload = () => {
          setDevices(getInitialDevices());
          showToast('✅ 接続デバイス一覧を最新状態に更新しました！');
        };
        document.body.appendChild(s);
      };

      const toggleDevice = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const nextState = !d.enabled;
            if (nextState) {
              CyberSound.playToggleOn(soundEnabled);
            } else {
              CyberSound.playToggleOff(soundEnabled);
            }
            showToast(`[${d.customName || d.name}] の入力を ${nextState ? '有効化 (ON)' : '停止 (OFF)'} にしました。`);
            return { ...d, enabled: nextState };
          }
          return d;
        }));
      };

      const emergencyResetAll = () => {
        CyberSound.playEmergency(soundEnabled);
        setDevices(prev => prev.map(d => ({ ...d, enabled: true })));
        showToast('【全機器復旧】すべてのデバイスの無効化を解除し、ON状態に一括リセットしました！');
      };

      const saveCustomName = (id) => {
        CyberSound.playClick(soundEnabled);
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const newName = tempName.trim() || d.name;
            showToast(`名称を [${newName}] に保存しました！`);
            return { ...d, customName: newName, name: newName };
          }
          return d;
        }));
        setEditingId(null);
      };

      const getHotkeyLabel = () => {
        const parts = [];
        if (hudHotkey.ctrl) parts.push('Ctrl');
        if (hudHotkey.alt) parts.push('Alt');
        if (hudHotkey.shift) parts.push('Shift');
        parts.push(hudHotkey.key.toUpperCase());
        return parts.join(' + ');
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.altKey && e.shiftKey && e.key.toLowerCase() === 'r') {
            e.preventDefault();
            emergencyResetAll();
            return;
          }

          if (enableHotkeys) {
            const matchAlt = hudHotkey.alt === e.altKey;
            const matchShift = hudHotkey.shift === e.shiftKey;
            const matchCtrl = hudHotkey.ctrl === e.ctrlKey;
            const matchKey = hudHotkey.key.toLowerCase() === e.key.toLowerCase();

            if (matchAlt && matchShift && matchCtrl && matchKey) {
              e.preventDefault();
              CyberSound.playClick(soundEnabled);
              setViewMode(prev => prev === 'hud' ? 'full' : 'hud');
              showToast(viewMode === 'hud' ? '🖥️ フル管理画面に切替' : `📌 ミニHUD表示に切替 (${getHotkeyLabel()})`);
              return;
            }
          }
          
          // キー入力検知: 左手デバイスやキーボードのカードをリアルタイム発光更新
          setDevices(prev => prev.map(d => {
            const isLeftHand = d.category.includes('左手') || d.name.toLowerCase().includes('tartarus') || d.name.toLowerCase().includes('orbweaver');
            const isKb = d.category.includes('キーボード') || d.name.toLowerCase().includes('keyboard');
            if ((isLeftHand || isKb) && d.enabled) {
              return {
                ...d,
                lastActive: Date.now(),
                telemetry: `キー検知: [${e.key === ' ' ? 'Space' : e.key}] | リアルタイム通信中`
              };
            }
            return d;
          }));
        };

        const handleMouseMove = (e) => {
          if (Math.abs(e.movementX) > 5 || Math.abs(e.movementY) > 5) {
            setDevices(prev => prev.map(d => {
              const isMouse = d.category.includes('マウス') || d.name.toLowerCase().includes('mouse') || d.id === 'pnp_046D_C534';
              if (isMouse && d.enabled) {
                return {
                  ...d,
                  lastActive: Date.now(),
                  telemetry: `移動検知: ${Math.round(Math.sqrt(e.movementX**2 + e.movementY**2))} px/f`
                };
              }
              return d;
            }));
          }
        };

        const handleMouseDown = (e) => {
          const btnName = e.button === 0 ? 'Left Click' : e.button === 2 ? 'Right Click' : 'Middle Click';
          setDevices(prev => prev.map(d => {
            const isMouse = d.category.includes('マウス') || d.name.toLowerCase().includes('mouse') || d.id === 'pnp_046D_C534';
            if (isMouse && d.enabled) {
              return {
                ...d,
                lastActive: Date.now(),
                telemetry: `クリック検知: ${btnName}`
              };
            }
            return d;
          }));
        };

        const scanGamepads = () => {
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (gp && (gp.buttons.some(b => b.pressed) || gp.axes.some(a => Math.abs(a) > 0.15))) {
              const gpName = (gp.id || '').toLowerCase();
              setDevices(prev => prev.map(d => {
                if (!d.category.includes('コントローラー') || !d.enabled) return d;
                const devName = (d.customName || d.name || '').toLowerCase();
                
                const isXbox = gpName.includes('xbox') || gpName.includes('xinput');
                const isPS = gpName.includes('sony') || gpName.includes('dual') || gpName.includes('playstation') || gpName.includes('wireless controller');
                
                let matches = false;
                if (isXbox && (devName.includes('xbox') || devName.includes('flydigi'))) {
                  matches = true;
                } else if (isPS && (devName.includes('sony') || devName.includes('playstation'))) {
                  matches = true;
                } else if (!isXbox && !isPS) {
                  matches = true;
                }

                if (matches) {
                  return {
                    ...d,
                    lastActive: Date.now(),
                    telemetry: `操作検知中 (${gp.id.split('(')[0].trim()})`
                  };
                }
                return d;
              }));
            }
          }
        };

        const timer = setInterval(scanGamepads, 200);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mousedown', handleMouseDown);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mousedown', handleMouseDown);
          clearInterval(timer);
        };
      }, [viewMode, hudHotkey, enableHotkeys, soundEnabled]);

      const categoryOrder = [
        '左手デバイス・キーパッド',
        'マウス / ポインティング',
        'ゲームコントローラー',
        'キーボード類',
        'テンキー類',
        'その他入力機器'
      ];
      const categories = Array.from(new Set(devices.map(d => d.category)))
        .sort((a, b) => {
          const idxA = categoryOrder.indexOf(a);
          const idxB = categoryOrder.indexOf(b);
          return (idxA !== -1 ? idxA : 99) - (idxB !== -1 ? idxB : 99);
        });

      if (viewMode === 'hud') {
        return (
          <div className="hud-overlay" style={{ opacity: hudOpacity }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 700, color: '#00f0ff', fontSize: '0.9rem', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <img src="icon.jpg" style={{ width: 18, height: 18, borderRadius: 4 }} />
                InputNexus ミニHUD
              </span>
              <button className="btn primary" style={{ padding: '3px 10px', fontSize: '0.75rem' }} onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('full'); }}>
                🖥️ フル画面に戻る
              </button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {devices.map(d => (
                <div key={d.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.05)', padding: '6px 10px', borderRadius: '8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <DeviceSilhouette dev={d} enabled={d.enabled} isRecent={false} />
                    <span style={{ fontWeight: 600, fontSize: '0.85rem' }}>{d.customName || d.name}</span>
                  </div>
                  <button className={`switch-btn ${d.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(d.id)}>{d.enabled ? 'ON' : 'OFF'}</button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (viewMode === 'tray') {
        return (
          <div className="tray-banner">
            <div>
              <div style={{ fontWeight: 700, color: '#e2b6ff', fontSize: '0.9rem' }}>⚙️ InputNexus タスクバー常駐中</div>
              <div style={{ fontSize: '0.78rem', color: '#8a99ad' }}>画面を邪魔せずバックグラウンドで動作中</div>
            </div>
            <div style={{ display: 'flex', gap: '6px' }}>
              <button className="btn primary" style={{ padding: '4px 10px', fontSize: '0.8rem' }} onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('hud'); }}>📌 ミニHUD ({getHotkeyLabel()})</button>
              <button className="btn" style={{ padding: '4px 10px', fontSize: '0.8rem' }} onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('full'); }}>🖥️ 開く</button>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {toast && <div className="toast">🔔 {toast}</div>}

          <header className="app-header">
            <div>
              <div className="brand-title">
                <img src="icon.jpg" className="brand-logo-img" alt="InputNexus Logo" />
                <span>InputNexus Prime</span>
                <span className="badge-v">Windows PnP リアルタイム検出</span>
              </div>
              <div className="sub-text">左手デバイス（Tartarus Pro等）・コントローラー・マウス個別物理制御</div>
            </div>

            <div className="header-actions">
              <button 
                className="btn"
                style={{ borderColor: 'rgba(0, 240, 255, 0.4)', color: '#00f0ff' }}
                onClick={rescanDevices}
                title="USB機器の接続状況を再検出"
              >
                🔄 機器再読込
              </button>

              <button 
                className={`sound-toggle-btn ${soundEnabled ? 'sound-on' : 'sound-off'}`}
                onClick={toggleSound}
                title="SF効果音の有効/消音切り替え"
              >
                {soundEnabled ? '🔊 効果音: ON' : '🔇 効果音: OFF'}
              </button>

              <div className="mode-switcher-bar">
                <button 
                  className={`mode-btn ${viewMode === 'full' ? 'active' : ''}`}
                  onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('full'); }}
                >
                  🖥️ フル画面
                </button>
                <button 
                  className={`mode-btn ${viewMode === 'hud' ? 'active' : ''}`}
                  onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('hud'); showToast(`📌 ミニHUD表示 (${getHotkeyLabel()})`); }}
                >
                  📌 HUD ({getHotkeyLabel()})
                </button>
                <button 
                  className={`mode-btn tray ${viewMode === 'tray' ? 'active' : ''}`}
                  onClick={() => { CyberSound.playClick(soundEnabled); setViewMode('tray'); showToast('⚙️ タスクバー常駐モード（画面非表示）'); }}
                >
                  ⚙️ 常駐
                </button>
                <button 
                  className="mode-btn"
                  style={{ color: '#00f0ff' }}
                  onClick={() => { CyberSound.playClick(soundEnabled); setShowSettingsModal(true); }}
                  title="キー干渉対策・ショートカットキーの自由変更設定"
                >
                  ⚙️ キー設定
                </button>
              </div>
            </div>
          </header>

          <div className="stats-bar">
            <span className="stat-pill">検出機器: <strong>{devices.length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#00ff88' }}>ON (有効): <strong>{devices.filter(d => d.enabled).length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#ff3366' }}>OFF (無効): <strong>{devices.filter(d => !d.enabled).length} 台</strong></span>
            <button className="btn danger" style={{ padding: '4px 10px', fontSize: '0.78rem' }} onClick={emergencyResetAll} title="Ctrl+Alt+Shift+R">🚨 全機器一括復旧</button>
          </div>

          {categories.map(cat => (
            <div key={cat} className="category-section">
              <div className="cat-title">📁 {cat}</div>
              <div className="cards-grid">
                {devices.filter(d => d.category === cat).map(device => {
                  const isRecent = device.enabled && (Date.now() - device.lastActive < 1800);
                  const recommend = getSmartRecommendation(device);
                  return (
                    <div key={device.id} className={`card ${isRecent ? 'active-glow' : ''}`}>
                      <div className="card-top">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                          <div className={`silhouette-badge ${isRecent ? 'active' : ''} ${!device.enabled ? 'disabled' : ''}`}>
                            <DeviceSilhouette dev={device} enabled={device.enabled} isRecent={isRecent} />
                          </div>

                          <div>
                            {editingId === device.id ? (
                              <div style={{ display: 'flex', gap: '4px' }}>
                                <input 
                                  type="text" 
                                  style={{ background: '#000', border: '1px solid #00f0ff', color: '#fff', padding: '2px 6px', borderRadius: '4px' }}
                                  value={tempName}
                                  onChange={e => setTempName(e.target.value)}
                                />
                                <button className="btn primary" style={{ padding: '2px 6px', fontSize: '0.7rem' }} onClick={() => saveCustomName(device.id)}>保存</button>
                              </div>
                            ) : (
                              <div className="dev-name-container">
                                <div className="dev-name">{device.customName || device.name}</div>
                                <button className="rename-btn" title="好きな名前に命名保存" onClick={() => { setEditingId(device.id); setTempName(device.customName || device.name); }}>✏️</button>
                              </div>
                            )}
                            <div className="dev-sub">
                              <span className={`conn-badge ${device.connectionType}`}>
                                {device.connectionTypeLabel}
                              </span>
                            </div>
                          </div>
                        </div>

                        <button className={`switch-btn ${device.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(device.id)}>
                          {device.enabled ? 'ON' : 'OFF'}
                        </button>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span className={`badge-status ${device.enabled ? 'active' : 'off'}`}>
                          {device.enabled ? '🟢 ON (操作受付中)' : '🔴 OFF (入力停止中)'}
                        </span>
                        {isRecent && <span style={{ color: '#00f0ff', fontWeight: 700, fontSize: '0.78rem' }}>⚡ リアルタイム通信中</span>}
                      </div>

                      <div className="telemetry-box">
                        {device.enabled ? device.telemetry : '🛑 入力は物理レベルで安全に停止されています'}
                      </div>

                      <div className="recommend-box">
                        <span className="recommend-label">
                          <span>🛒</span>
                          <span>{recommend.text}</span>
                        </span>
                        <a 
                          href={`https://www.amazon.co.jp/s?k=${encodeURIComponent(recommend.query)}`} 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="recommend-link"
                          onClick={() => CyberSound.playClick(soundEnabled)}
                        >
                          詳細 ↗
                        </a>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {/* キー設定 ＆ 干渉防止モーダル */}
          {showSettingsModal && (
            <div className="modal-bg" onClick={() => setShowSettingsModal(false)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <h3 style={{ color: '#00f0ff' }}>⚙️ ショートカットキー干渉防止 ＆ 設定</h3>
                <div style={{ fontSize: '0.85rem', color: '#8a99ad', lineHeight: 1.5, display: 'flex', flexDirection: 'column', gap: '14px' }}>
                  <p>他のゲームやアプリ（OBS, Discord, Photoshop等）とキーが重なって干渉する場合は、呼び出しキーを自由に変更または無効化できます。</p>
                  
                  <div className="hotkey-setting-box">
                    <div>
                      <div style={{ fontWeight: 700, color: '#fff' }}>現在のミニHUD呼び出しキー</div>
                      <div style={{ color: '#00f0ff', fontWeight: 800, fontSize: '1.1rem', marginTop: '4px' }}>{getHotkeyLabel()}</div>
                    </div>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      <button className="btn" onClick={() => { CyberSound.playClick(soundEnabled); setHudHotkey({ alt: false, shift: false, ctrl: false, key: 'F9' }); }}>F9キーに変更</button>
                      <button className="btn" onClick={() => { CyberSound.playClick(soundEnabled); setHudHotkey({ alt: true, shift: true, ctrl: false, key: 'd' }); }}>Alt+Shift+D (初期値)</button>
                    </div>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(0,0,0,0.3)', padding: '10px 14px', borderRadius: '8px' }}>
                    <span>ショートカットキー呼び出し機能を有効にする</span>
                    <button className={`switch-btn ${enableHotkeys ? 'on' : 'off'}`} onClick={() => { CyberSound.playClick(soundEnabled); setEnableHotkeys(!enableHotkeys); }}>
                      {enableHotkeys ? '有効 (ON)' : '無効 (OFF)'}
                    </button>
                  </div>
                </div>
                <button className="btn primary" onClick={() => { CyberSound.playClick(soundEnabled); setShowSettingsModal(false); }}>設定完了</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
