<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InputNexus - PC入力デバイス統合マネージャー (WebHID物理スキャン & カスタム命名対応)</title>
  <link rel="icon" type="image/jpeg" href="icon.jpg" />
  
  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-card: rgba(18, 22, 31, 0.85);
      --bg-glass: rgba(15, 20, 30, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-yellow: #ffb800;
      --accent-purple: #9d4edd;
      --accent-red: #ff3366;
      --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.35);
      --font-main: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
    }

    .app-container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .app-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      padding: 16px 24px; background: var(--bg-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); border-radius: 16px;
    }
    .brand-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .brand-logo-img { width: 44px; height: 44px; border-radius: 10px; box-shadow: var(--glow-cyan); border: 1px solid var(--accent-cyan); object-fit: cover; }
    .badge-v { background: rgba(0,240,255,0.15); color: var(--accent-cyan); font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; }
    .sub-text { color: var(--text-muted); font-size: 0.84rem; margin-top: 2px; }
    
    .btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; font-weight: 700; border: none; }
    .btn.accent { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .btn.warning { background: rgba(255, 184, 0, 0.15); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
    
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-card); padding: 12px 20px; border-radius: 14px; border: 1px solid var(--border-color);
    }
    .stat-pill { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.84rem; }
    
    .empty-state {
      background: rgba(18, 22, 31, 0.6); border: 2px dashed var(--border-color);
      border-radius: 20px; padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .empty-icon-img { width: 80px; height: 80px; border-radius: 16px; border: 1px solid var(--accent-cyan); box-shadow: var(--glow-cyan); }
    .empty-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-cyan); }
    .empty-desc { color: var(--text-muted); font-size: 0.9rem; max-width: 540px; line-height: 1.5; }

    .category-section { display: flex; flex-direction: column; gap: 12px; }
    .cat-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      transition: all 0.2s ease; position: relative;
    }
    .card.active-glow {
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      animation: pulse-anim 1.0s infinite alternate;
    }
    @keyframes pulse-anim { 0% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); } 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.7); } }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .dev-name-container { display: flex; align-items: center; gap: 6px; }
    .dev-name { font-size: 0.98rem; font-weight: 700; }
    .rename-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; }
    .rename-btn:hover { color: var(--accent-cyan); }

    .dev-sub { color: var(--text-muted); font-size: 0.76rem; margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .conn-badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px;
      font-size: 0.74rem; font-weight: 700; font-family: var(--font-mono);
    }
    .conn-badge.usb { background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); border: 1px solid rgba(0, 240, 255, 0.3); }
    .conn-badge.bluetooth { background: rgba(157, 78, 221, 0.2); color: #e2b6ff; border: 1px solid rgba(157, 78, 221, 0.4); }
    .conn-badge.webhid { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 255, 136, 0.3); }

    .badge-status { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.74rem; }
    .badge-status.active { background: rgba(0,255,136,0.15); color: var(--accent-green); border: 1px solid rgba(0,255,136,0.3); }
    .badge-status.off { background: rgba(255,51,102,0.15); color: var(--accent-red); border: 1px solid rgba(255,51,102,0.3); }

    .switch-btn {
      padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none;
    }
    .switch-btn.on { background: rgba(0,255,136,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .switch-btn.off { background: rgba(255,51,102,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .telemetry-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); font-size: 0.78rem; font-family: var(--font-mono); }
    
    .hud-overlay {
      position: fixed; top: 16px; right: 16px; width: 380px; z-index: 9999;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(16px); border: 1px solid var(--accent-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.8), var(--glow-cyan); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 10000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #121620; border: 1px solid var(--border-color); border-radius: 18px; padding: 24px; max-width: 540px; width: 100%;
      display: flex; flex-direction: column; gap: 16px;
    }

    .toast {
      background: rgba(0,240,255,0.15); border: 1px solid var(--accent-cyan); color: #fff;
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.88rem;
    }

    .rename-input {
      background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); color: #fff;
      padding: 4px 8px; border-radius: 6px; font-size: 0.9rem; font-weight: 700; width: 180px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 定番ブランドのUSB Vendor ID (VID) データベース
    const VENDOR_DB = {
      '0x1532': 'Razer (レーザー)',
      '0x046d': 'Logitech / Logicool',
      '0x045e': 'Microsoft / Xbox',
      '0x054c': 'Sony PlayStation',
      '0x057e': 'Nintendo Switch',
      '0x2dc8': '8BitDo (エイトビットドゥー)',
      '0x1b1c': 'Corsair (コルセア)',
      '0x0853': 'Topre Realforce',
      '0x0f0d': 'HORI (ホリ)',
      '0x31e3': 'Flydigi (フライディジ)',
      '0x256c': 'GameSir (ゲームサー)'
    };

    function App() {
      const [devices, setDevices] = useState([]);
      const [toast, setToast] = useState(null);
      const [isCompact, setIsCompact] = useState(false);
      const [hudOpacity, setHudOpacity] = useState(0.85);
      const [editingId, setEditingId] = useState(null);
      const [tempName, setTempName] = useState('');
      const [showTechModal, setShowTechModal] = useState(false);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const registerOrUpdateDevice = (devInfo) => {
        setDevices(prev => {
          const exists = prev.find(d => d.id === devInfo.id);
          if (exists) {
            return prev.map(d => d.id === devInfo.id ? { 
              ...d, 
              ...devInfo, 
              name: d.customName || devInfo.name, 
              lastActive: Date.now() 
            } : d);
          }
          showToast(`【実機識別】[${devInfo.name}] (${devInfo.connectionTypeLabel}) を検出しました！`);
          return [...prev, { ...devInfo, customName: null, enabled: true, lastActive: Date.now() }];
        });
      };

      const toggleDevice = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const nextState = !d.enabled;
            showToast(`[${d.customName || d.name}] を ${nextState ? '有効化 (ON)' : '無効化 (OFF)'} にしました。`);
            return { ...d, enabled: nextState };
          }
          return d;
        }));
      };

      const saveCustomName = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const newName = tempName.trim() || d.name;
            showToast(`デバイス名を [${newName}] に変更しました！`);
            return { ...d, customName: newName, name: newName };
          }
          return d;
        }));
        setEditingId(null);
      };

      // WebHID Direct Hardware USB Scan
      const requestWebHidScan = async () => {
        if (!('hid' in navigator)) {
          alert('お使いのブラウザはWebHIDに対応していません（Edge/Chromeをご利用ください）。');
          return;
        }

        try {
          const hidDevices = await navigator.hid.requestDevice({ filters: [] });
          if (hidDevices.length === 0) return;

          hidDevices.forEach(dev => {
            const vidHex = '0x' + dev.vendorId.toString(16).padStart(4, '0');
            const pidHex = '0x' + dev.productId.toString(16).padStart(4, '0');
            const brandStr = VENDOR_DB[vidHex] || 'USB入力機器';
            const fullName = dev.productName ? `${brandStr} (${dev.productName})` : `${brandStr} [${vidHex}:${pidHex}]`;

            let cat = 'キーボード・入力機器';
            if (fullName.toLowerCase().includes('tartarus') || fullName.toLowerCase().includes('keypad')) {
              cat = '左手デバイス / キーパッド (独立)';
            } else if (fullName.toLowerCase().includes('controller') || fullName.toLowerCase().includes('pad')) {
              cat = 'ゲームコントローラー';
            }

            registerOrUpdateDevice({
              id: `webhid_${dev.vendorId}_${dev.productId}`,
              name: fullName,
              category: cat,
              connectionType: 'webhid',
              connectionTypeLabel: '🔌 USB物理WebHID直結',
              telemetry: `VID: ${vidHex} | PID: ${pidHex} | 物理ハードウェア直接認識`
            });
          });
        } catch (e) {
          // User cancelled
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.altKey && e.shiftKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            setIsCompact(prev => !prev);
            return;
          }
          
          registerOrUpdateDevice({
            id: 'real_keyboard',
            name: 'メインキーボード / 左手キーパッド (入力合流)',
            category: 'キーボード・入力機器',
            connectionType: 'usb',
            connectionTypeLabel: '🔌 有線 USB / BT',
            telemetry: `最新キー: [${e.key === ' ' ? 'Space' : e.key}] | リアルタイム入力`
          });
        };

        const handleMouseMove = (e) => {
          if (Math.abs(e.movementX) > 5 || Math.abs(e.movementY) > 5) {
            registerOrUpdateDevice({
              id: 'real_mouse',
              name: 'マウス / ポインティングデバイス',
              category: 'マウス / ポインティング',
              connectionType: 'usb',
              connectionTypeLabel: '🔌 USB 有線 / 2.4G',
              telemetry: `移動速度: ${Math.round(Math.sqrt(e.movementX**2 + e.movementY**2))} px/f`
            });
          }
        };

        const scanGamepads = () => {
          const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < gamepads.length; i++) {
            const gp = gamepads[i];
            if (gp) {
              const isBt = gp.id.toLowerCase().includes('bluetooth') || gp.id.toLowerCase().includes('wireless');
              
              // Vendor ID からの名称判定
              let matchedBrand = 'サードパーティ製コントローラー';
              if (gp.id.toLowerCase().includes('8bitdo')) matchedBrand = '8BitDo コントローラー';
              if (gp.id.toLowerCase().includes('dualsense') || gp.id.toLowerCase().includes('054c')) matchedBrand = 'Sony DualSense / PS5コン';
              if (gp.id.toLowerCase().includes('gamesir')) matchedBrand = 'GameSir コントローラー';
              if (gp.id.toLowerCase().includes('flydigi')) matchedBrand = 'Flydigi コントローラー';

              let isPressed = gp.buttons.some(b => b.pressed);
              let stickMoved = gp.axes.some(a => Math.abs(a) > 0.15);

              if (isPressed || stickMoved) {
                registerOrUpdateDevice({
                  id: `gp_${gp.index}`,
                  name: `${matchedBrand} (XInput/DirectInput #${gp.index + 1})`,
                  category: 'ゲームコントローラー',
                  connectionType: isBt ? 'bluetooth' : 'usb',
                  connectionTypeLabel: isBt ? '🔵 Bluetooth 無線' : '🔌 USB 有線',
                  telemetry: `入力操作中: ${gp.id.split('(')[0]}`
                });
              }
            }
          }
        };

        const timer = setInterval(scanGamepads, 200);
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('mousemove', handleMouseMove);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('mousemove', handleMouseMove);
          clearInterval(timer);
        };
      }, []);

      const categories = Array.from(new Set(devices.map(d => d.category)));

      if (isCompact) {
        return (
          <div className="hud-overlay" style={{ opacity: hudOpacity }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 700, color: '#00f0ff', fontSize: '0.9rem', display: 'flex', alignItems: 'center', gap: '6px' }}>
                <img src="icon.jpg" style={{ width: 18, height: 18, borderRadius: 4 }} />
                InputNexus HUD
              </span>
              <button className="btn" style={{ padding: '3px 8px', fontSize: '0.75rem' }} onClick={() => setIsCompact(false)}>通常表示に戻す</button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {devices.map(d => (
                <div key={d.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.05)', padding: '6px 10px', borderRadius: '8px' }}>
                  <div>
                    <span style={{ fontWeight: 600, fontSize: '0.85rem' }}>{d.customName || d.name}</span>
                  </div>
                  <button className={`switch-btn ${d.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(d.id)}>{d.enabled ? 'ON' : 'OFF'}</button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {toast && <div className="toast">🔔 {toast}</div>}

          <header className="app-header">
            <div>
              <div className="brand-title">
                <img src="icon.jpg" className="brand-logo-img" alt="InputNexus Logo" />
                <span>InputNexus</span>
                <span className="badge-v">WebHID 物理識別対応</span>
              </div>
              <div className="sub-text">デバイスの物理USB識別・名前カスタムリネーム・入力検知機能</div>
            </div>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              <button className="btn primary" onClick={requestWebHidScan}>🔌 USB物理WebHID検出</button>
              <button className="btn warning" onClick={() => setShowTechModal(true)}>❓ 名前や合流の仕様解説</button>
              <button className="btn accent" onClick={() => setIsCompact(true)}>ミニHUD (Alt+Shift+D)</button>
            </div>
          </header>

          <div className="stats-bar">
            <span className="stat-pill">検出機器: <strong>{devices.length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#00ff88' }}>ON (有効): <strong>{devices.filter(d => d.enabled).length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#ff3366' }}>OFF (無効): <strong>{devices.filter(d => !d.enabled).length} 台</strong></span>
          </div>

          {devices.length === 0 ? (
            <div className="empty-state">
              <img src="icon.jpg" className="empty-icon-img" alt="Icon" />
              <div className="empty-title">入力機器の自動検出準備完了</div>
              <div className="empty-desc">
                キーボードを押すかマウス/コントローラーを操作すると自動検知されます。<br/>
                また、上の <strong>「🔌 USB物理WebHID検出」</strong> ボタンを押すと、接続されているRazer Tartarusや8BitDo、Logicool等の正確な機器名を取得できます！
              </div>
            </div>
          ) : (
            categories.map(cat => (
              <div key={cat} className="category-section">
                <div className="cat-title">📁 {cat}</div>
                <div className="cards-grid">
                  {devices.filter(d => d.category === cat).map(device => {
                    const isRecent = Date.now() - device.lastActive < 1800;
                    return (
                      <div key={device.id} className={`card ${isRecent ? 'active-glow' : ''}`}>
                        <div className="card-top">
                          <div>
                            {editingId === device.id ? (
                              <div style={{ display: 'flex', gap: '4px' }}>
                                <input 
                                  type="text" 
                                  className="rename-input"
                                  value={tempName}
                                  onChange={e => setTempName(e.target.value)}
                                  placeholder="名前を入力..."
                                />
                                <button className="btn primary" style={{ padding: '2px 8px', fontSize: '0.75rem' }} onClick={() => saveCustomName(device.id)}>保存</button>
                              </div>
                            ) : (
                              <div className="dev-name-container">
                                <div className="dev-name">{device.customName || device.name}</div>
                                <button 
                                  className="rename-btn" 
                                  title="このデバイスに好きな名前を付ける（例: 左手Tartarus）"
                                  onClick={() => { setEditingId(device.id); setTempName(device.customName || device.name); }}
                                >
                                  ✏️
                                </button>
                              </div>
                            )}
                            <div className="dev-sub">
                              <span className={`conn-badge ${device.connectionType}`}>
                                {device.connectionTypeLabel}
                              </span>
                            </div>
                          </div>
                          <button className={`switch-btn ${device.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(device.id)}>
                            {device.enabled ? 'ON' : 'OFF'}
                          </button>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <span className={`badge-status ${device.enabled ? 'active' : 'off'}`}>
                            {device.enabled ? '🟢 ON (操作受付中)' : '🔴 OFF (無効中)'}
                          </span>
                          {isRecent && <span style={{ color: '#00f0ff', fontWeight: 700, fontSize: '0.78rem' }}>⚡ 入力検知中！</span>}
                        </div>

                        <div className="telemetry-box">
                          {device.telemetry}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))
          )}

          {/* Windows仕様・名前解説モーダル */}
          {showTechModal && (
            <div className="modal-bg" onClick={() => setShowTechModal(false)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <h3 style={{ color: '#00f0ff' }}>💡 デバイス名と合流に関するWindowsの仕組み解説</h3>
                <div style={{ fontSize: '0.85rem', color: '#8a99ad', lineHeight: 1.5, display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <p><strong>Q. なぜ他社製コントローラーが「XBOX」と出たり、キーボードが合流するのか？</strong></p>
                  <ul style={{ paddingLeft: '20px', color: '#f0f4f8' }}>
                    <li>🎮 <strong>コントローラーの名称（XInput仕様）</strong>: Windows標準ドライバーの仕様上、8BitDoやHORI、GameSir等のサードパーティ製コントローラーは一律で「Xbox Controller」という名前でOSに報告されます。</li>
                    <li>⌨️ <strong>キーボードの合流（Windows仕様）</strong>: Windowsは複数キーボードの入力をOS最上層で1つの入力ストリームにまとめて処理します。</li>
                  </ul>
                  <p style={{ color: '#00ff88' }}>
                    <strong>【当アプリの解決策】</strong><br/>
                    1. 画面上の ✏️ アイコンを押して「左手キーパッド」「メインコン」など<strong>好きな名前に自由にリネーム保存</strong>できます！<br/>
                    2. 画面上の「<strong>🔌 USB物理WebHID検出</strong>」ボタンを押すと、USBの物理型番から正確な製品名を直接読み取ります！
                  </p>
                </div>
                <button className="btn primary" onClick={() => setShowTechModal(false)}>閉じる</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
