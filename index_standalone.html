<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InputNexus - PC入力デバイス統合マネージャー (カテゴリ独立・安全設計版)</title>
  
  <!-- React & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-card: rgba(18, 22, 31, 0.85);
      --bg-glass: rgba(15, 20, 30, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-yellow: #ffb800;
      --accent-purple: #9d4edd;
      --accent-red: #ff3366;
      --glow-cyan: 0 0 15px rgba(0, 240, 255, 0.35);
      --font-main: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
    }

    .app-container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .app-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      padding: 16px 24px; background: var(--bg-glass); backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); border-radius: 16px;
    }
    .brand-title { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .badge-v { background: rgba(0,240,255,0.15); color: var(--accent-cyan); font-size: 0.72rem; padding: 2px 8px; border-radius: 6px; }
    .sub-text { color: var(--text-muted); font-size: 0.84rem; margin-top: 2px; }
    
    .btn {
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color);
      color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
    .btn.primary { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; font-weight: 700; border: none; }
    .btn.accent { background: rgba(0, 255, 136, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    
    .safety-banner {
      background: rgba(157, 78, 221, 0.12); border: 1px solid rgba(157, 78, 221, 0.4);
      padding: 10px 16px; border-radius: 12px; font-size: 0.84rem; color: #e2b6ff; display: flex; align-items: center; gap: 10px;
    }

    .stats-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      background: var(--bg-card); padding: 12px 20px; border-radius: 14px; border: 1px solid var(--border-color);
    }
    .stat-pill { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.84rem; }
    
    .category-section { display: flex; flex-direction: column; gap: 12px; }
    .cat-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      transition: all 0.2s ease;
    }
    .card.active-glow {
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
      animation: pulse-anim 1.0s infinite alternate;
    }
    @keyframes pulse-anim { 0% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); } 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.7); } }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .dev-name { font-size: 0.98rem; font-weight: 700; }
    .dev-sub { color: var(--text-muted); font-size: 0.76rem; margin-top: 2px; display: flex; gap: 8px; }
    .badge-status { padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.74rem; }
    .badge-status.active { background: rgba(0,255,136,0.15); color: var(--accent-green); border: 1px solid rgba(0,255,136,0.3); }
    .badge-status.off { background: rgba(255,51,102,0.15); color: var(--accent-red); border: 1px solid rgba(255,51,102,0.3); }

    .switch-btn {
      padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none;
    }
    .switch-btn.on { background: rgba(0,255,136,0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .switch-btn.off { background: rgba(255,51,102,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .telemetry-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); font-size: 0.78rem; font-family: var(--font-mono); }
    
    /* HUD Overlay */
    .hud-overlay {
      position: fixed; top: 16px; right: 16px; width: 380px; z-index: 9999;
      background: rgba(10,12,16,0.92); backdrop-filter: blur(16px); border: 1px solid var(--accent-cyan);
      box-shadow: 0 8px 30px rgba(0,0,0,0.8), var(--glow-cyan); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 10000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #121620; border: 1px solid var(--border-color); border-radius: 18px; padding: 24px; max-width: 520px; width: 100%;
      display: flex; flex-direction: column; gap: 16px;
    }

    .toast {
      background: rgba(0,240,255,0.15); border: 1px solid var(--accent-cyan); color: #fff;
      padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // カテゴリを「メインキーボード」「左手デバイス」「VR/トラッカー」「コントローラー」「マウス」「フットペダル」等に完全独立化！
    const INITIAL_DEVICES = [
      { id: 'kb_main', name: 'Realforce R3 メインキーボード', category: 'メインキーボード', connection: 'USB', enabled: true, lastActive: Date.now() - 5000, telemetry: '最終キー: [W] | 状況: 有効 (同時使用可能)' },
      { id: 'kb_tartarus', name: 'Razer Tartarus Pro (独立左手デバイス)', category: '左手デバイス / キーパッド', connection: 'USB', enabled: true, lastActive: Date.now() - 12000, telemetry: '最終キー: [Stick Up] | ★メインKBと独立動作' },
      { id: 'gamepad_xbox', name: 'Xbox Wireless Controller', category: 'ゲームコントローラー', connection: 'Bluetooth', enabled: true, lastActive: Date.now() - 2000, telemetry: 'ボタン: [A] | スティック: (0.12, -0.45)' },
      { id: 'vr_knuckles', name: 'Valve Index Controllers / Oculus Touch', category: 'VR / モーション機器', connection: 'USB/無線', enabled: true, lastActive: 0, telemetry: '6DoF トラッキング準備完了 (VID:0x28DE)' },
      { id: 'mouse_superlight', name: 'Logitech G PRO X SUPERLIGHT 2', category: 'マウス / ポインティング', connection: 'USB', enabled: true, lastActive: Date.now() - 1000, telemetry: '速度: 45 px/f | Left Click' },
      { id: 'foot_pedal', name: 'Elgato Stream Deck Pedal (フットペダル)', category: 'フットペダル / 特殊入力', connection: 'USB', enabled: true, lastActive: 0, telemetry: 'Pedal 1 (L): Ready | (VID:0x0fd9)' }
    ];

    function App() {
      const [devices, setDevices] = useState(INITIAL_DEVICES);
      const [toast, setToast] = useState(null);
      const [isCompact, setIsCompact] = useState(false);
      const [hudOpacity, setHudOpacity] = useState(0.85);
      const [showVrGuideModal, setShowVrGuideModal] = useState(false);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // 独立トグル（他のデバイスを勝手にOFFにしない安全設計）
      const toggleDevice = (id) => {
        setDevices(prev => prev.map(d => {
          if (d.id === id) {
            const nextState = !d.enabled;
            showToast(`[${d.name}] を ${nextState ? '有効化 (ON)' : '無効化 (OFF)'} にしました。`);
            return { ...d, enabled: nextState };
          }
          return d;
        }));
      };

      // キーボード・Gamepad入力検知（複数デバイス同時にONでも個別に正確発光）
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.altKey && e.shiftKey && e.key.toLowerCase() === 'd') {
            e.preventDefault();
            setIsCompact(prev => !prev);
            return;
          }
          
          setDevices(prev => {
            const activeKb = prev.find(d => (d.category === 'メインキーボード' || d.category === '左手デバイス / キーパッド') && d.enabled);
            if (activeKb) {
              return prev.map(d => d.id === activeKb.id ? {
                ...d,
                lastActive: Date.now(),
                telemetry: `最終キー: [${e.key === ' ' ? 'Space' : e.key}]`
              } : d);
            }
            return prev;
          });
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // カテゴリごとにグループ化
      const categories = Array.from(new Set(devices.map(d => d.category)));

      if (isCompact) {
        return (
          <div className="hud-overlay" style={{ opacity: hudOpacity }}>
            <div style={{ display: 'flex', justifyBetween: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 700, color: '#00f0ff', fontSize: '0.9rem' }}>⚡ InputNexus Mini HUD</span>
              <button className="btn" style={{ padding: '3px 8px', fontSize: '0.75rem' }} onClick={() => setIsCompact(false)}>通常表示に戻す</button>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
              {devices.map(d => (
                <div key={d.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.05)', padding: '6px 10px', borderRadius: '8px' }}>
                  <div>
                    <span style={{ fontWeight: 600, fontSize: '0.85rem' }}>{d.name}</span>
                    <span style={{ marginLeft: '8px', fontSize: '0.72rem', color: d.enabled ? '#00ff88' : '#ff3366' }}>
                      {d.enabled ? 'ON' : 'OFF'}
                    </span>
                  </div>
                  <button className={`switch-btn ${d.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(d.id)}>{d.enabled ? 'ON' : 'OFF'}</button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {toast && <div className="toast">🔔 {toast}</div>}

          <header className="app-header">
            <div>
              <div className="brand-title">
                🎮 InputNexus 
                <span className="badge-v">安全独立トグル仕様</span>
              </div>
              <div className="sub-text">左手デバイス・キーボード・VR・フットペダルの安全同時管理</div>
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button className="btn accent" onClick={() => setIsCompact(true)}>ミニHUD (Alt+Shift+D)</button>
              <button className="btn" onClick={() => setShowVrGuideModal(true)}>🥽 VR・USB自動識別仕様</button>
            </div>
          </header>

          <div className="safety-banner">
            🛡️ <strong>安全設計ガイド:</strong> 左手デバイスをONにしても、メインキーボードが勝手にOFFになることはありません。すべての接続デバイスは並行して同時にON状態を保持できます。
          </div>

          <div className="stats-bar">
            <span className="stat-pill">接続中: <strong>{devices.length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#00ff88' }}>ON (有効): <strong>{devices.filter(d => d.enabled).length} 台</strong></span>
            <span className="stat-pill" style={{ color: '#ff3366' }}>OFF (個別無効): <strong>{devices.filter(d => !d.enabled).length} 台</strong></span>
          </div>

          {categories.map(cat => (
            <div key={cat} className="category-section">
              <div className="cat-title">📁 {cat}</div>
              <div className="cards-grid">
                {devices.filter(d => d.category === cat).map(device => {
                  const isRecent = Date.now() - device.lastActive < 1800;
                  return (
                    <div key={device.id} className={`card ${isRecent ? 'active-glow' : ''}`}>
                      <div className="card-top">
                        <div>
                          <div className="dev-name">{device.name}</div>
                          <div className="dev-sub">
                            <span>[{device.category}]</span>
                            <span>{device.connection}</span>
                          </div>
                        </div>
                        <button className={`switch-btn ${device.enabled ? 'on' : 'off'}`} onClick={() => toggleDevice(device.id)}>
                          {device.enabled ? 'ON' : 'OFF'}
                        </button>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span className={`badge-status ${device.enabled ? 'active' : 'off'}`}>
                          {device.enabled ? '🟢 ON (操作受付中)' : '🔴 OFF (個別無効中)'}
                        </span>
                        {isRecent && <span style={{ color: '#00f0ff', fontWeight: 700, fontSize: '0.78rem' }}>⚡ 入力中！</span>}
                      </div>

                      <div className="telemetry-box">
                        {device.telemetry}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {/* VR・USB自動識別仕様解説モーダル */}
          {showVrGuideModal && (
            <div className="modal-bg" onClick={() => setShowVrGuideModal(false)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <h3 style={{ color: '#00f0ff' }}>🥽 VR機器やUSB入力デバイスの自動仕分け仕組み</h3>
                <div style={{ fontSize: '0.85rem', color: '#8a99ad', lineHeight: 1.5, display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <p><strong>質問: USBに接続された様々な機器をどう識別するのか？</strong></p>
                  <p>
                    WindowsおよびWebAPIでは、すべてのUSB/Bluetooth機器が持つ固有の <strong>Vendor ID (製造元コード)</strong> と <strong>Product ID (製品コード)</strong>、および <strong>HID Usage Class (機器種別コード)</strong> を読み取って自動的に仕分けます：
                  </p>
                  <ul style={{ paddingLeft: '20px', color: '#f0f4f8' }}>
                    <li>🥽 <strong>VR機器 (Valve Index / Meta Quest / Vive)</strong>: VID 0x28DE / 0x2833 等から「VR/トラッカー」と自動判定</li>
                    <li>🕹️ <strong>左手デバイス (Razer Tartarus / Orbweaver)</strong>: VID 0x1532 等から「左手キーパッド」と自動判定</li>
                    <li>🦶 <strong>フットペダル / ハンコン</strong>: ペダル専用Usage Pageから独立カテゴリへ仕分け</li>
                  </ul>
                  <p style={{ color: '#00ff88' }}>
                    💡 各機器は独立したカテゴリとして管理されるため、1つを切り替えても他の機器に影響しない安全設計です。
                  </p>
                </div>
                <button className="btn primary" onClick={() => setShowVrGuideModal(false)}>了解</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
